[workspace]
resolver = "2"
members = [
    "crates/libluna",
    "crates/libluna-core",
    "crates/libluna-i18n",
    "crates/libluna-render",
    "crates/libluna-platform",
    "crates/libluna-widgets",
    "apps/luna-demo",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.80"
authors = ["Patryk Szkudlarek / libLuna contributors"]
repository = "https://github.com/mijsys/libLuna"

[workspace.dependencies]
libluna-core = { path = "crates/libluna-core", version = "0.0.1" }
libluna-i18n = { path = "crates/libluna-i18n", version = "0.0.1" }
libluna-render = { path = "crates/libluna-render", version = "0.0.1" }
libluna-platform = { path = "crates/libluna-platform", version = "0.0.1" }
libluna-widgets = { path = "crates/libluna-widgets", version = "0.0.1" }
libluna = { path = "crates/libluna", version = "0.0.1" }

tiny-skia = "0.11"
